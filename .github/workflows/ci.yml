name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy app

      - name: Architecture contracts
        run: lint-imports

      - name: Tests
        # The whole suite runs with no Bright Data key and no network:
        # the CLI is behind a Protocol and replaced by FakeCli.
        #
        # COVERAGE_CORE=sysmon selects Python 3.12's sys.monitoring tracer. The
        # default C tracer loses line events when SQLAlchemy's async layer switches
        # greenlets, so every service method appeared to stop being executed at its
        # first `await` — under-reporting service coverage by up to 19 points on
        # code the integration tests demonstrably run. The number below is the
        # honest one.
        env:
          COVERAGE_CORE: sysmon
        run: pytest --cov=app --cov-report=term-missing
